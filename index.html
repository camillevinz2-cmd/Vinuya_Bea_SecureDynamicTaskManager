<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Dynamic Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1>Secure Dynamic Task Manager</h1>

    <div class="controls">
      <label for="taskInput" class="sr-only">Task</label>
      <input type="text" id="taskInput" placeholder="Enter a task">

      <div class="actions">
        <button id="addTaskBtn">Add Task</button>
        <button id="loadSamplesBtn" class="secondary">Load Sample Tasks</button>
      </div>
    </div>

    <p id="taskMessage" class="message" role="alert" aria-live="polite"></p>

    <ul id="taskList"></ul>

    <section class="summary" aria-label="Task summary">
      <p>Total Tasks: <span id="totalCount">0</span></p>
      <p>Pending: <span id="pendingCount">0</span></p>
      <p>Completed: <span id="completedCount">0</span></p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
